<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 60 880 880" width="1000" height="1000">
  <!-- Gyra favicon: 三环设计, 透明背景 -->
  <!-- 主色: indigo #4f46e5 -->
  <!-- 几何(实测自 gyra_logo_3loop_oxblood.jpg): 外环圆心(500,473.4) r270.8 底部缺口51-129°; 中环圆心(500,520.8) r178.1 偏心整圆; 圆点(500,538.2) r64.6 -->
  <!-- viewBox 裁剪至 60..940, 图标视觉占比更大 -->

  <!-- 外环: 缺口在底部 51°-129°, dasharray 实现 (C=1701.5, 缺口368.7) -->
  <circle cx="500" cy="473.4" r="270.8" fill="none" stroke="#4f46e5"
          stroke-width="36.5" stroke-dasharray="1332.8 368.7" stroke-dashoffset="1091.8"/>

  <!-- 中环: 偏心整圆 -->
  <circle cx="500" cy="520.8" r="178.1" fill="none" stroke="#4f46e5" stroke-width="14.6"/>

  <!-- 圆点 -->
  <circle cx="500" cy="538.2" r="64.6" fill="#4f46e5"/>
</svg>
