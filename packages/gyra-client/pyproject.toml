[project]
name = "gyra-client"
version = "0.7.0"
description = "Add your description here"
authors = [
    { name = "csunny", email = "cfqcsunny@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.10"

dependencies = ["gyra-serve"]

[project.urls]
Homepage = "https://github.com/gyra-ai/gyra"
Documentation = "http://docs.gyra.ai/docs/overview"
Repository = "https://github.com/gyra-ai/gyra.git"
Issues = "https://github.com/gyra-ai/gyra/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/gyra_client"]
exclude = [
    "src/gyra_client/**/tests",
    "src/gyra_client/**/tests/*",
    "src/gyra_client/tests",
    "src/gyra_client/tests/*",
    "src/gyra_client/**/examples",
    "src/gyra_client/**/examples/*"
]